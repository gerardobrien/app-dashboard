<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App Dashboard</title>
  <style>
    body { font-family: ui-monospace, Menlo, monospace; background:#0d1117; color:#c9d1d9; margin:0; padding:2rem; }
    h1 { color:#3fb950; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:1rem; }
    .card { border:1px solid #30363d; border-radius:8px; padding:1rem; text-decoration:none; color:inherit; }
    .card:hover { border-color:#3fb950; }
    .status { font-size:.75rem; text-transform:uppercase; color:#8b949e; }
  </style>
</head>
<body>
  <h1>$ ls ~/apps</h1>
  <div class="grid" id="apps"></div>
  <script>
    fetch('apps.json')
      .then(r => r.json())
      .then(apps => {
        document.getElementById('apps').innerHTML = apps.map(a => `
          <a class="card" href="${a.url}">
            <div class="status">${a.status}</div>
            <h3>${a.name}</h3>
            <p>${a.description}</p>
          </a>`).join('');
      });
  </script>
</body>
</html>
